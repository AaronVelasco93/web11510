<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
</head>
<style>
    .parrafo1{
        background-color: blueviolet;
        border: 1px solid red;
        padding-bottom: 15px;
        margin-bottom: 35px;
    }
    .parrafo2{
        background-color: aquamarine;
        border: 1px solid black;
        padding-top: 16px;
    }
</style>
<body>
    <p class="parrafo1" >Hola mundo</p>
    <p class="parrafo2" >Hola mundo 2</p>
    
</body>
</html>
